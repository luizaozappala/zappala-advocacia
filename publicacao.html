<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Publicação | Zappalá Advocacia &amp; Consultoria</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--ink:#192028;--sage:#6C7D92;--sage-pale:#ACB8C7;--paper:#EDE8DD;--line:#C6BEAF;--text:#272A2D;--mute:#5E646C}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font-family:'Libre Franklin',sans-serif;font-weight:300;line-height:1.75}.wrap{max-width:1180px;margin:auto;padding:0 28px}.mast{background:var(--ink);padding:18px 0;color:var(--paper)}.mast .wrap{display:flex;justify-content:space-between;gap:24px;align-items:center}.brand{font-family:'Newsreader',serif;font-size:20px;color:var(--paper);text-decoration:none}.brand em{color:var(--sage-pale)}.back{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-pale);text-decoration:none}.article{max-width:790px;margin:0 auto;padding:76px 28px 100px}.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:22px}h1{font-family:'Newsreader',serif;font-weight:400;color:var(--ink);font-size:clamp(38px,5vw,58px);line-height:1.08;margin:0}.excerpt{font-size:19px;color:#2C333C;margin:26px 0 36px}.cover{width:100%;height:auto;display:block;margin:0 0 42px}.body{font-size:17.5px}.body h2,.body h3{font-family:'Newsreader',serif;color:var(--ink);line-height:1.25}.body h2{font-size:29px;margin:2em 0 .65em}.body h3{font-size:22px;margin:1.7em 0 .55em}.body p{margin:0 0 1.2em}.body ul,.body ol{padding-left:1.35em;margin:0 0 1.2em}.body a{color:#445366}.author{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}.insta{display:inline-block;margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#445366}footer{background:var(--ink);color:rgba(237,232,221,.55);padding:32px 0;font-size:12px}</style></head><body><header class="mast"><div class="wrap"><a class="brand" href="index.html">Zappalá <em>Advocacia &amp; Consultoria</em></a><a class="back" href="informativos.html">← Informativos</a></div></header><main class="article"><div id="article"><p>Carregando publicação…</p></div></main><footer><div class="wrap">Conteúdo informativo. As informações não substituem a análise jurídica individualizada de um caso concreto.</div></footer><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function md(src){src=esc(src||'');src=src.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');const blocks=src.split(/\n{2,}/).map(b=>{if(/^<(h2|h3)/.test(b))return b;if(/^[-*] /m.test(b)){const li=b.split('\n').filter(Boolean).map(x=>'<li>'+x.replace(/^[-*] /,'')+'</li>').join('');return '<ul>'+li+'</ul>';}return '<p>'+b.replace(/\n/g,'<br>')+'</p>';});return blocks.join('');}
const slug=new URLSearchParams(location.search).get('slug');fetch('data/informativos.json',{cache:'no-store'}).then(r=>r.json()).then(posts=>{const p=posts.find(x=>x.slug===slug);if(!p)throw 0;document.title=p.title+' | Zappalá Advocacia & Consultoria';const d=p.date?new Date(p.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):'';document.getElementById('article').innerHTML=`<div class="meta">${esc(p.category||'Informativo')} · ${esc(d)}</div><h1>${esc(p.title)}</h1>${p.excerpt?`<div class="excerpt">${esc(p.excerpt)}</div>`:''}${p.cover?`<img class="cover" src="${esc(p.cover)}" alt="${esc(p.cover_alt||p.title)}">`:''}<div class="body">${md(p.body)}</div><div class="author">${p.author?'Por '+esc(p.author):'Zappalá Advocacia & Consultoria'}${p.instagram_url?`<br><a class="insta" href="${esc(p.instagram_url)}" target="_blank" rel="noopener">Ver publicação no Instagram</a>`:''}</div>`}).catch(()=>{document.getElementById('article').innerHTML='<h1>Publicação não encontrada</h1><p class="excerpt">Volte à página de informativos para ver as publicações disponíveis.</p>'});</script></body></html>
